const demoStudents=[['Анна','Соколова'],['Михаил','Иванов'],['Екатерина','Морозова'],['Пётр','Семёнов'],['Сергей','Бородин'],['Дмитрий','Александров'],['Мария','Лебедева'],['Александр','Волков'],['София','Павлова'],['Артём','Кузнецов'],['Алина','Орлова'],['Даниил','Попов']].map(([name,surname],i)=>({id:i+1,name,surname,phoneNumber:`+7 (916) 555-${String(i+1).padStart(4,'0')}`,email:`student${i+1}@example.com`}));
const demoUsers=[{id:1,email:'superadmin@example.com',roles:['SUPER_ADMIN']},{id:2,email:'admin@example.com',roles:['ADMIN']},{id:3,email:'teacher@example.com',roles:['TEACHER']}];
let demoDB={students:structuredClone(demoStudents),users:structuredClone(demoUsers)};
const has=r=>state.session?.roles?.includes(r);
const studentAccess=()=>has('ADMIN')||has('TEACHER');
const canWrite=()=>state.view==='users'?has('SUPER_ADMIN'):has('ADMIN');
const initials=r=>(r.name?`${r.name[0]||''}${r.surname?.[0]||''}`:r.email?.slice(0,2)||'К').toUpperCase();
const display=r=>state.view==='users'?r.email:[r.surname,r.name].filter(Boolean).join(' ');
function notify(message,error=false){const n=document.createElement('div');n.className='toast'+(error?' error':'');n.textContent=message;$('#toasts').append(n);setTimeout(()=>n.remove(),4500)}
function themeButton(){return `<button class="icon-btn theme-toggle" data-action="theme" aria-label="Переключить тему" title="Переключить тему">${icon(document.documentElement.dataset.theme==='dark'?'sun':'moon')}</button>`}
function toggleTheme(){const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('campus-theme',theme)}catch{}document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#172926':'#f4f0e7';document.querySelectorAll('[data-action="theme"]').forEach(b=>b.innerHTML=icon(theme==='dark'?'sun':'moon'))}
function setSession(session){state.session=session;if(!state.demo){try{sessionStorage.setItem('campus-session',JSON.stringify(session))}catch{}}state.view=studentAccess()?'students':'users';state.query='';state.page=1;state.roleFilter='all';state.rows=[];state.loading=true;renderShell();loadRows()}
function logout(message){state.request++;state.session=null;state.rows=[];state.demo=false;try{sessionStorage.removeItem('campus-session')}catch{}$('#modal').close();renderLogin();if(message)notify(message,true)}
async function api(path,options={}){if(!state.session)throw Error('Войдите в систему.');if(Date.now()>=state.session.expiresAt){logout('Сессия истекла. Войдите снова.');throw Error('Сессия истекла.')}return request(path,options,true)}
async function request(path,options={},auth=false){let response;try{response=await fetch('/api/v1'+path,{...options,headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+state.session.token}:{}),...options.headers}})}catch{throw Error('Не удалось связаться с сервером. Проверьте подключение и повторите попытку.')}let body=null;const text=await response.text();if(text){try{body=JSON.parse(text)}catch{}}if(!response.ok){if(response.status===401&&auth){logout('Сессия недействительна. Войдите снова.');throw Error('Необходим повторный вход.')}const defaults={400:'Проверьте введённые данные.',401:'Неверный email или пароль.',403:'У вас нет прав на это действие.',404:'Запись не найдена. Обновите список.',409:'Пользователь с таким email уже существует.'};throw Error((response.status<500&&(body?.message||body?.error))||defaults[response.status]||'Сервер не смог выполнить запрос. Попробуйте ещё раз.')}return body}
function renderLogin(){document.title='Кампус — вход';$('#app').innerHTML=`<main class="login-page"><section class="login-story"><div class="brand"><span class="brand-mark">${icon('students')}</span>кампус<span style="font-size:12px;opacity:.6;align-self:end;margin-bottom:3px">/</span></div><div class="story"><div class="eyebrow">Университет. Люди. Порядок.</div><h1>Меньше рутины.<br>Больше внимания<br>студентам.</h1><p>Всё, что нужно для работы со студентами, — в одном спокойном пространстве.</p><div class="story-card">${icon('students')}<div><strong>Каждый студент на своём месте</strong><span>Списки, контакты и доступ к данным</span></div></div></div><div class="story-bottom">ПРОСТРАНСТВО УЧЕБНОГО ПРОЦЕССА</div><div class="orb" aria-hidden="true"></div></section><section class="login-panel">${themeButton()}<div class="login-form-wrap"><span class="pill"><span class="dot"></span>Личный кабинет</span><h2>С возвращением</h2><p>Войдите, чтобы продолжить работу.</p><form id="login-form"><div class="form-error" id="login-error" role="alert"></div><div class="field"><label for="login-email">Электронная почта</label><input id="login-email" name="email" type="email" placeholder="name@university.ru" autocomplete="username" required maxlength="254"></div><div class="field"><label for="login-password">Пароль</label><div class="password-wrap"><input id="login-password" name="password" type="password" placeholder="Введите пароль" autocomplete="current-password" required><button type="button" data-action="password" aria-label="Показать пароль">Показать</button></div></div><button class="btn primary wide" type="submit">Войти в систему ${icon('arrow')}</button></form><p class="login-help">Для реального входа запустите проект. Здесь доступна демонстрация.</p><div class="divider">сначала познакомиться</div><button class="btn wide" data-action="demo">${icon('grid')}Посмотреть интерфейс</button><p class="login-bottom">Нажмите «Посмотреть интерфейс». Данные демонстрационные.</p></div></section></main>`;
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=$('button[type=submit]',form),error=$('#login-error');error.textContent='';button.disabled=true;button.textContent='Проверяем данные…';try{const data=new FormData(form),email=data.get('email').trim(),r=await request('/auth/login',{method:'POST',body:JSON.stringify({email,password:data.get('password')})});if(!r?.token||!Array.isArray(r.roles))throw Error('Сервер вернул некорректный ответ.');state.demo=false;setSession({token:r.token,email,roles:r.roles.map(r=>r.replace(/^ROLE_/,'')),expiresAt:Date.now()+(Number(r.expiresIn)||3600)*1000})}catch(err){error.textContent=err.message;button.disabled=false;button.innerHTML=`Войти в систему ${icon('arrow')}`}})}
function startDemo(){state.demo=true;demoDB={students:structuredClone(demoStudents),users:structuredClone(demoUsers)};setSession({email:'admin@example.com',roles:['ADMIN'],expiresAt:Infinity});notify('Демонстрационные данные. Изменения не попадут на сервер.')}
function renderShell(){if(!state.session)return;const users=state.view==='users',title=users?'Пользователи':'Студенты';document.title=`Кампус — ${title.toLowerCase()}`;$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div><div class="brand"><span class="brand-mark">${icon('students')}</span>кампус<span class="subtle" style="font-size:14px">/</span></div><div class="brand-sub">Учебный процесс, без лишнего</div></div><div class="nav-label">РАБОЧЕЕ ПРОСТРАНСТВО</div><nav class="nav" aria-label="Разделы">${studentAccess()?`<button class="nav-btn ${users?'':'active'}" data-view="students" ${users?'':'aria-current="page"'}>${icon('students')}Студенты <span class="count" id="nav-count">—</span></button>`:''}${has('SUPER_ADMIN')?`<button class="nav-btn ${users?'active':''}" data-view="users" ${users?'aria-current="page"':''}>${icon('users')}Пользователи</button>`:''}</nav><div class="sidebar-note">${icon('shield')}<strong style="font-size:12px">У каждого своя роль</strong><p>${esc(state.session.roles.map(r=>roleNotes[r]).filter(Boolean).join('. '))}.</p></div><div class="account"><span class="avatar">${esc(state.session.email.slice(0,2).toUpperCase())}</span><div class="account-info"><strong>${esc(state.session.roles.map(r=>roleNames[r]||r).join(', '))}</strong><span title="${esc(state.session.email)}">${esc(state.session.email)}</span></div><button class="icon-btn" data-action="logout" title="Выйти" aria-label="Выйти">${icon('logout')}</button></div></aside><main class="main"><header class="topbar"><div class="breadcrumb">Рабочее пространство <span>/</span><span>${title}</span></div><div class="topbar-right"><span class="today">${esc(new Intl.DateTimeFormat('ru',{day:'numeric',month:'long',year:'numeric'}).format(new Date()))}</span><span class="pill"><span class="dot"></span>${state.demo?'Демонстрация':'Личный кабинет'}</span>${themeButton()}</div></header>${state.demo?`<div class="demo-bar"><span>Демо · изменения временные</span><label>Роль <select id="demo-role" aria-label="Роль в демонстрации">${Object.entries(roleNames).map(([r,n])=>`<option value="${r}" ${has(r)?'selected':''}>${n}</option>`).join('')}</select></label></div>`:''}<section class="intro"><div><div class="eyebrow">${users?'УПРАВЛЕНИЕ ДОСТУПОМ':'УЧЕБНЫЙ ОТДЕЛ'}</div><h1>${title}</h1><p>${users?'Люди, роли и доступ к рабочему пространству.':'Все студенты. Нужные контакты. Ничего лишнего.'}</p></div>${canWrite()?`<button class="btn primary" data-action="create">${icon('plus')}Добавить ${users?'пользователя':'студента'}</button>`:''}</section><section class="stats" aria-label="Сводка" id="stats"></section><section class="directory" aria-labelledby="directory-heading"><div class="directory-title"><div><h2 id="directory-heading">${users?'Пользователи системы':'Список студентов'}</h2><p>${users?'Управляйте учётными записями и ролями':'Откройте карточку, чтобы посмотреть контакты'}</p></div><span class="badge ${canWrite()?'green':''}">${canWrite()?'Можно редактировать':'Только просмотр'}</span></div><div class="toolbar"><label class="search">${icon('search')}<input type="search" id="search" aria-label="${users?'Поиск по email':'Поиск по имени, фамилии или ID'}" placeholder="${users?'Найти пользователя по email…':'Найти по имени, фамилии или ID…'}" value="${esc(state.query)}"></label>${users?`<select id="role-filter" aria-label="Фильтр по роли"><option value="all">Все роли</option>${Object.entries(roleNames).map(([r,n])=>`<option value="${r}">${n}</option>`).join('')}</select>`:''}<select id="sort" aria-label="Сортировка"><option value="name">${users?'По email: А–Я':'По фамилии: А–Я'}</option><option value="name-desc">${users?'По email: Я–А':'По фамилии: Я–А'}</option><option value="new">Сначала новые</option></select><button class="icon-btn" data-action="refresh" aria-label="Обновить список" title="Обновить список">${icon('refresh')}</button></div><div id="list" aria-live="polite"></div></section><footer class="page-footer"><span class="footer-left">${icon('shield')}${state.demo?'Данные только для знакомства с интерфейсом':'Доступ к данным определяется вашей ролью'}</span><span>Кампус · пространство учебного процесса</span></footer></main></div>`;
$('#sort').value=state.sort;if($('#role-filter'))$('#role-filter').value=state.roleFilter;
$('#search').addEventListener('input',e=>{state.query=e.target.value;state.page=1;renderList()});$('#sort').addEventListener('change',e=>{state.sort=e.target.value;renderList()});$('#role-filter')?.addEventListener('change',e=>{state.roleFilter=e.target.value;state.page=1;renderList()});$('#demo-role')?.addEventListener('change',e=>{const r=e.target.value;state.session.roles=[r];state.session.email=r==='SUPER_ADMIN'?'superadmin@example.com':r==='ADMIN'?'admin@example.com':'teacher@example.com';state.view=r==='SUPER_ADMIN'?'users':'students';state.query='';state.page=1;state.roleFilter='all';state.rows=[];state.loading=true;renderShell();loadRows()});renderStats();renderList()}
function renderStats(){if(!$('#stats'))return;const users=state.view==='users';const count=state.loading?'—':state.rows.length,second=users?state.rows.filter(r=>r.roles?.includes('TEACHER')).length:state.rows.filter(r=>r.name&&r.surname).length;$('#stats').innerHTML=`<article class="stat"><span class="stat-icon">${icon(users?'users':'students')}</span><span class="stat-label">${users?'Всего пользователей':'Всего студентов'}</span><strong class="stat-value">${count}</strong><span class="stat-note">${users?'Учётные записи системы':'Записи в справочнике'}</span></article><article class="stat"><span class="stat-icon">${icon(users?'students':'grid')}</span><span class="stat-label">${users?'Преподавателей':'С именем и фамилией'}</span><strong class="stat-value">${state.loading?'—':second}</strong><span class="stat-note">${users?'Доступ к просмотру студентов':'Заполненные основные данные'}</span></article><article class="stat"><span class="stat-icon">${icon('shield')}</span><span class="stat-label">Ваш доступ</span><strong class="stat-value" style="font-size:23px;margin-top:18px">${canWrite()?'Редактирование':'Просмотр'}</strong><span class="stat-note">${users?'Управление пользователями':canWrite()?'Создание и изменение записей':'Список и контактные данные'}</span></article>`;if($('#nav-count'))$('#nav-count').textContent=state.view==='students'?count:'—'}
async function loadRows(){const req=++state.request,view=state.view;state.loading=true;state.error='';renderStats();renderList();try{let rows;if(state.demo){rows=structuredClone(demoDB[view])}else{const r=await api(view==='users'?'/users':'/student');rows=view==='users'?r?.responses:r?.response;if(!Array.isArray(rows))throw Error('Сервер вернул неожиданный формат списка.')}if(req!==state.request||!state.session)return;state.rows=rows}catch(err){if(req===state.request)state.error=err.message}finally{if(req===state.request&&state.session){state.loading=false;renderStats();renderList()}}}
function renderList(){const list=$('#list');if(!list)return;if(state.loading){list.innerHTML='<div class="empty"><span class="loading" aria-hidden="true"></span><p style="margin-top:15px">Загружаем данные…</p></div>';return}if(state.error){list.innerHTML=`<div class="empty">${icon('refresh')}<h3>Не удалось загрузить список</h3><p>${esc(state.error)}</p><button class="btn" data-action="refresh">Повторить</button></div>`;return}const users=state.view==='users',q=state.query.trim().toLocaleLowerCase('ru');let rows=state.rows.filter(r=>(users?r.email:`${r.name} ${r.surname} ${r.surname} ${r.name} ${r.id}`).toLocaleLowerCase('ru').includes(q)&&(!users||state.roleFilter==='all'||r.roles?.includes(state.roleFilter)));rows.sort((a,b)=>state.sort==='new'?b.id-a.id:display(a).localeCompare(display(b),'ru')*(state.sort==='name-desc'?-1:1));const pages=Math.max(1,Math.ceil(rows.length/state.size));state.page=Math.min(state.page,pages);const start=(state.page-1)*state.size,visible=rows.slice(start,start+state.size);if(!rows.length){list.innerHTML=`<div class="empty">${icon('search')}<h3>${state.rows.length?'Ничего не найдено':users?'Пользователей пока нет':'Студентов пока нет'}</h3><p>${state.rows.length?'Попробуйте другой запрос или измените фильтр.':canWrite()?'Добавьте первую запись, чтобы начать работу.':'Здесь появятся записи, добавленные администратором.'}</p>${state.rows.length?'<button class="btn" data-action="clear-search">Сбросить поиск и фильтры</button>':canWrite()?`<button class="btn primary" data-action="create">${icon('plus')}Добавить запись</button>`:''}</div>`;return}list.innerHTML=`<div class="table-wrap"><table><thead><tr><th scope="col">${users?'Пользователь':'Студент'}</th><th scope="col">ID записи</th><th scope="col">${users?'Роль':'Контакты'}</th><th scope="col" style="text-align:right">Действия</th></tr></thead><tbody>${visible.map((r,i)=>`<tr><td><div class="person-cell"><span class="avatar v${i%3}">${esc(initials(r))}</span><div><button class="name-link" data-action="details" data-id="${r.id}">${esc(display(r))}</button><small>${users?esc((r.roles||[]).map(x=>roleNames[x]||x).join(', ')):'Студент университета'}</small></div></div></td><td><span class="record-id">#${String(r.id).padStart(4,'0')}</span></td><td>${users?(r.roles||[]).map(role=>`<span class="badge ${role==='TEACHER'?'':'green'}">${esc(roleNames[role]||role)}</span>`).join(' '):`<button class="text-btn" data-action="details" data-id="${r.id}" style="font-size:12px">Карточка студента ${icon('arrow')}</button>`}</td><td><div class="row-actions">${canWrite()?`<button class="icon-btn" data-action="edit" data-id="${r.id}" title="Редактировать ${esc(display(r))}" aria-label="Редактировать ${esc(display(r))}">${icon('edit')}</button><button class="icon-btn remove" data-action="delete" data-id="${r.id}" title="Удалить ${esc(display(r))}" aria-label="Удалить ${esc(display(r))}">${icon('trash')}</button>`:`<button class="icon-btn" data-action="details" data-id="${r.id}" title="Открыть карточку" aria-label="Открыть карточку ${esc(display(r))}">${icon('arrow')}</button>`}</div></td></tr>`).join('')}</tbody></table></div><div class="table-footer"><span>${start+1}–${Math.min(start+state.size,rows.length)} из ${rows.length}${q||state.roleFilter!=='all'?' · с учётом фильтра':''}</span><div class="pagination"><button class="icon-btn prev" data-action="prev" aria-label="Предыдущая страница" ${state.page===1?'disabled':''}>${icon('chevron')}</button><span class="page-num">${state.page} / ${pages}</span><button class="icon-btn" data-action="next" aria-label="Следующая страница" ${state.page===pages?'disabled':''}>${icon('chevron')}</button></div></div>`}
function showModal(title,subtitle,body){const modal=$('#modal');modal.innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="icon-btn" data-action="close" aria-label="Закрыть">${icon('close')}</button></div><div class="modal-body">${body}</div>`;if(!modal.open)modal.showModal()}
async function getRecord(id){const r=state.rows.find(r=>r.id===id);if(!r)throw Error('Запись не найдена. Обновите список.');if(state.view==='users'||state.demo)return structuredClone(r);return api('/student/'+id)}
async function details(id){showModal('Карточка','Загружаем данные…','<span class="loading"></span>');try{const view=state.view,r=await getRecord(id);if(!$('#modal').open)return;const users=view==='users';showModal(users?'Пользователь':'Карточка студента',`Запись #${String(id).padStart(4,'0')}`,`<div class="details-hero"><span class="avatar">${esc(initials(r))}</span><div><h2>${esc(users?r.email:[r.name,r.surname].join(' '))}</h2><p class="subtle" style="font-size:12px">${users?'Учётная запись системы':'Студент университета'}</p></div></div>${users?`<div class="detail-line"><span>Роли</span><span>${(r.roles||[]).map(x=>esc(roleNames[x]||x)).join(', ')}</span></div>`:`<div class="detail-line"><span>Электронная почта</span><span>${esc(r.email||'Не указана')}</span></div><div class="detail-line"><span>Телефон</span><span>${esc(r.phoneNumber||'Не указан')}</span></div>`}<div class="modal-actions"><button class="btn" data-action="close">Закрыть</button>${canWrite()?`<button class="btn primary" data-action="edit" data-id="${id}">${icon('edit')}Редактировать</button>`:''}</div>`)}catch(e){$('#modal').close();notify(e.message,true)}}
const inputField=(id,label,value='',type='text',extra='')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`;
async function editRecord(id){if(!canWrite())return;let r={};if(id){try{r=await getRecord(id)}catch(e){notify(e.message,true);return}}const users=state.view==='users';showModal(id?'Редактирование':'Новая запись',users?'Учётная запись и права доступа':id?'Имя и фамилия доступны только при создании':'Добавьте студента в справочник',`<form id="record-form"><div id="record-error" class="form-error" role="alert"></div>${users?`${inputField('email','Электронная почта',r.email,'email','required maxlength="254" autocomplete="off"')}${inputField('password',id?'Новый пароль <span class="hint">· оставьте пустым, чтобы сохранить</span>':'Пароль','','password',`${id?'':'required'} minlength="6" maxlength="72" autocomplete="new-password"`)}<label style="font-size:12px;font-weight:650">Роли доступа</label><div class="role-options">${Object.entries(roleNames).map(([role,name])=>`<label class="role-option"><input type="checkbox" name="roles" value="${role}" ${r.roles?.includes(role)?'checked':''}><span>${name}<small>${roleNotes[role]}</small></span></label>`).join('')}</div>`:`<div class="form-grid">${inputField('name','Имя',r.name,'text',`required maxlength="100" ${id?'readonly':''}`)}${inputField('surname','Фамилия',r.surname,'text',`required maxlength="100" ${id?'readonly':''}`)}<div class="full">${inputField('email','Электронная почта <span class="hint">· необязательно</span>',r.email,'email','maxlength="254"')}${inputField('phoneNumber','Телефон <span class="hint">· необязательно</span>',r.phoneNumber,'tel','maxlength="40"')}</div></div>`}<div class="modal-actions"><button class="btn" type="button" data-action="close">Отмена</button><button class="btn primary" type="submit">${id?'Сохранить изменения':'Добавить'}</button></div></form>`);
$('#record-form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,fd=new FormData(form),button=$('button[type=submit]',form),error=$('#record-error');let payload;if(users){const roles=fd.getAll('roles');if(!roles.length){error.textContent='Выберите хотя бы одну роль.';return}if(id&&r.email===state.session.email&&!roles.includes('SUPER_ADMIN')){error.textContent='Нельзя убрать у своей учётной записи роль суперадминистратора.';return}payload={email:fd.get('email').trim(),password:fd.get('password'),roles}}else{payload=id?{email:fd.get('email').trim(),phoneNumber:fd.get('phoneNumber').trim()}:{name:fd.get('name').trim(),surname:fd.get('surname').trim(),email:fd.get('email').trim(),phone_number:fd.get('phoneNumber').trim()};if(!id&&(!payload.name||!payload.surname)){error.textContent='Укажите имя и фамилию.';return}}button.disabled=true;button.textContent='Сохраняем…';error.textContent='';try{if(state.demo){const table=demoDB[state.view];if(users&&table.some(x=>x.email===payload.email&&x.id!==id))throw Error('Пользователь с таким email уже существует.');if(id){Object.assign(table.find(x=>x.id===id),payload)}else{table.push({...payload,id:Math.max(0,...table.map(x=>x.id))+1,...(!users?{phoneNumber:payload.phone_number}:{})})}}else{await api((users?'/users':'/student')+(id?'/'+id:'/save'),{method:id?'PUT':'POST',body:JSON.stringify(payload)})}const selfChanged=users&&id&&r.email===state.session.email;$('#modal').close();if(selfChanged){logout();notify('Учётная запись обновлена. Войдите с актуальными данными.');return}notify(id?'Изменения сохранены':'Запись добавлена');await loadRows()}catch(err){if(!$('#modal').open)return;error.textContent=err.message;button.disabled=false;button.textContent=id?'Сохранить изменения':'Добавить'}})}
function deleteRecord(id){if(!canWrite())return;const r=state.rows.find(r=>r.id===id);if(!r)return;if(state.view==='users'&&r.email===state.session.email){notify('Нельзя удалить собственную учётную запись.',true);return}showModal('Удалить запись?',display(r),`<p style="color:var(--muted);font-size:14px">Запись будет удалена ${state.demo?'из демонстрационного списка':'из базы данных'}. Отменить это действие нельзя.</p><div id="delete-error" class="form-error" role="alert" style="margin-top:15px"></div><div class="modal-actions"><button class="btn" data-action="close">Оставить</button><button class="btn danger" id="confirm-delete">Удалить</button></div>`);$('#confirm-delete').addEventListener('click',async e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Удаляем…';try{if(state.demo)demoDB[state.view]=demoDB[state.view].filter(x=>x.id!==id);else await api((state.view==='users'?'/users':'/student')+'/'+id,{method:'DELETE'});$('#modal').close();notify('Запись удалена');await loadRows()}catch(err){if(!$('#modal').open)return;$('#delete-error').textContent=err.message;b.disabled=false;b.textContent='Удалить'}})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-view]');if(!b||b.disabled)return;if(b.dataset.view){state.view=b.dataset.view;state.query='';state.roleFilter='all';state.page=1;state.rows=[];state.loading=true;renderShell();loadRows();return}const id=Number(b.dataset.id);switch(b.dataset.action){case'theme':toggleTheme();break;case'password':{const input=$('#login-password');input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'Показать':'Скрыть';b.setAttribute('aria-label',input.type==='password'?'Показать пароль':'Скрыть пароль');break}case'demo':startDemo();break;case'logout':logout();break;case'close':$('#modal').close();break;case'create':editRecord();break;case'edit':editRecord(id);break;case'details':details(id);break;case'delete':deleteRecord(id);break;case'refresh':loadRows();break;case'prev':state.page--;renderList();break;case'next':state.page++;renderList();break;case'clear-search':state.query='';state.roleFilter='all';state.page=1;$('#search').value='';if($('#role-filter'))$('#role-filter').value='all';renderList();break}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
try{const saved=JSON.parse(sessionStorage.getItem('campus-session')||'null');if(saved?.token&&saved.expiresAt>Date.now()&&Array.isArray(saved.roles))state.session=saved;else sessionStorage.removeItem('campus-session')}catch{}
if(state.session){state.view=studentAccess()?'students':'users';renderShell();loadRows()}else renderLogin();
</script></body></html>
